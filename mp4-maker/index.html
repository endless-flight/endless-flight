<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0}</style></head><body>
<meta charset="utf-8">
<title>MP4メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* Layout: 画像→音声→実行 の3段階を、左に番号の縦線でつないだ1カラム。夜空の紺と、星の金緑がアクセント。 */
  :root {
    --bg: #f2f4fa;
    --surface: #ffffff;
    --surface-2: #e9edf8;
    --ink: #101f4d;
    --muted: #55628a;
    --line: #d3d9ea;
    --accent: #1a2f7a;
    --on-accent: #eef3a8;
    --star: #9aa21e;
    --focus: #2b8aa3;
    --ok: #1d7a4d;
    --err: #b3261e;
    --err-bg: #fbe9e7;
    --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #080f2c; --surface: #0f1b4a; --surface-2: #162462; --ink: #eceffa; --muted: #9ba8d0;
      --line: #25376f; --accent: #dbe56e; --on-accent: #0a1440; --star: #dbe56e; --focus: #6cc0d6;
      --ok: #7ad6a4; --err: #ff9b92; --err-bg: #3a1a2a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #080f2c; --surface: #0f1b4a; --surface-2: #162462; --ink: #eceffa; --muted: #9ba8d0;
    --line: #25376f; --accent: #dbe56e; --on-accent: #0a1440; --star: #dbe56e; --focus: #6cc0d6;
    --ok: #7ad6a4; --err: #ff9b92; --err-bg: #3a1a2a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; padding-inline: 16px; padding-block: 28px 56px; }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand svg { width: 30px; height: 30px; flex: none; color: var(--star); }
  h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.2; margin: 0; letter-spacing: .02em; text-wrap: balance; }
  .lede { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .chip[data-s="loading"] i { background: var(--star); animation: pulse 1.2s ease-in-out infinite; }
  .chip[data-s="ready"] i { background: var(--ok); }
  .chip[data-s="failed"] i { background: var(--err); }
  .chip button { border: 0; background: none; padding: 0; text-decoration: underline; cursor: pointer; color: var(--ink); }
  @keyframes pulse { 50% { opacity: .25; } }

  .step { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 0 14px; position: relative; }
  .step::before { content: ""; position: absolute; left: 17px; top: 40px; bottom: -28px; width: 2px; background: var(--line); }
  .step:last-child::before { display: none; }
  .num { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 17px; }
  .step h2 { font-family: var(--font-display); font-size: 17px; margin: 5px 0 2px; line-height: 1.3; }
  .hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .btn { appearance: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.icon { padding: 7px 10px; line-height: 1; }
  .btn.add { align-self: flex-start; border-style: dashed; background: transparent; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .drop { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 14px; align-items: center; border: 1.5px dashed var(--line); border-radius: 8px; padding: 10px; transition: border-color .15s, background .15s; }
  .drop.over, .list.over { border-color: var(--star); background: var(--surface-2); }
  .thumb { width: 112px; aspect-ratio: 16 / 9; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 11px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fname { font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; min-width: 0; }
  .fname.empty { color: var(--muted); font-family: var(--font-body); font-size: 13px; }
  .meta { color: var(--muted); font-size: 12px; }

  .list { display: flex; flex-direction: column; gap: 8px; border: 1.5px dashed transparent; border-radius: 8px; transition: border-color .15s, background .15s; }
  .row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
  .row .tag { font-size: 12px; color: var(--muted); }

  .opts { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg label { cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; padding: 7px 12px; font-size: 13px; background: var(--surface-2); }
  .seg input:checked + span { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: -2px; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }

  .run { appearance: none; border: 0; width: 100%; padding: 15px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .04em; cursor: pointer; }
  .run:hover:not(:disabled) { filter: brightness(1.08); }
  .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar b { display: block; height: 100%; width: 0; background: var(--star); transition: width .2s; }
  .status { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
  .status span:last-child { font-variant-numeric: tabular-nums; flex: none; }
  .error { background: var(--err-bg); color: var(--err); border-radius: 8px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }

  .results { display: flex; flex-direction: column; gap: 8px; }
  .res { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .kind { font-family: var(--font-mono); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: var(--accent); color: var(--on-accent); }
  .res .size { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .note { font-size: 12px; color: var(--muted); margin: 0; }

  @media (max-width: 520px) {
    h1 { font-size: 24px; }
    .drop { grid-template-columns: 88px minmax(0, 1fr); }
    .drop .btn { grid-column: 1 / -1; }
    .thumb { width: 88px; }
    .row { grid-template-columns: minmax(0, 1fr) auto auto; }
    .row .tag { grid-column: 1 / -1; }
    .res { grid-template-columns: auto minmax(0, 1fr) auto; }
    .res .size { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5l2.4 7.1 7.1 2.4-7.1 2.4L12 20.5l-2.4-7.1L2.5 11l7.1-2.4z"/></svg>
        <h1>MP4メーカー</h1>
      </div>
      <p class="lede">画像1枚と、動画や音声から取り出した音を合成して MP4 にします。処理はこのブラウザの中だけで行い、ファイルは送信しません。</p>
    </div>
    <span class="chip" id="engine" data-s="loading" role="status"><i></i><span id="engineText">エンジン準備中</span></span>
  </header>

  <section class="step">
    <div class="num" aria-hidden="true">①</div>
    <div>
      <h2>画像選択</h2>
      <p class="hint">MP4の背景になる画像です。</p>
      <div class="panel">
        <div class="drop" id="imageDrop">
          <div class="thumb" id="thumb">未選択</div>
          <div>
            <div class="fname empty" id="imageName">画像をここにドロップ、または選択</div>
            <div class="meta" id="imageMeta">png / jpg / webp</div>
          </div>
          <button class="btn" type="button" id="pickImage">画像を選択…</button>
        </div>
      </div>
    </div>
  </section>

  <section class="step">
    <div class="num" aria-hidden="true">②</div>
    <div>
      <h2>MP3音声抽出</h2>
      <p class="hint">音声を取り出す動画・音声ファイル（mp4 / mov / m4a / mp3 など）です。＋で何個でも追加できます。</p>
      <div class="panel">
        <div class="list" id="list"></div>
        <button class="btn add" type="button" id="addRow">＋ ファイルを追加</button>
      </div>
    </div>
  </section>

  <section class="step">
    <div class="num" aria-hidden="true">③</div>
    <div>
      <h2>実行</h2>
      <p class="hint">①と②を合わせた MP4 を作ります。</p>
      <div class="panel">
        <div class="opts">
          <div class="seg" role="radiogroup" aria-label="出力のしかた">
            <label><input type="radio" name="mode" value="separate" checked><span>ファイルごとに作る</span></label>
            <label><input type="radio" name="mode" value="concat"><span>つなげて1本にする</span></label>
          </div>
          <label class="check"><input type="checkbox" id="keepMp3"> MP3も保存する</label>
        </div>
        <button class="run" type="button" id="run">MP4を作る</button>
        <div id="progress" hidden>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barBox"><b id="barFill"></b></div>
          <div class="status"><span id="statusText"></span><span id="statusPct"></span></div>
        </div>
        <div class="error" id="error" role="alert" hidden></div>
        <div class="results" id="results" hidden></div>
        <p class="note">長い動画では数分かかります。完了までこのタブを開いたままにしてください。</p>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const FF_VER = "0.12.10", CORE_VER = "0.12.6", WASM_PARTS = 3;
  const AUDIO_ACCEPT = "video/*,audio/*,.mov,.MOV,.mp4,.m4v,.mkv,.webm,.mp3,.m4a,.wav,.aac,.flac,.ogg";
  const IMAGE_ACCEPT = "image/*,.png,.jpg,.jpeg,.webp,.bmp";

  const state = { image: null, rows: [{ id: 1, file: null }], nextId: 2, busy: false, results: [] };

  /* ---------- 小さな道具 ---------- */
  const extOf = (n) => { const m = /\.([A-Za-z0-9]{1,6})$/.exec(n || ""); return m ? m[1].toLowerCase() : ""; };
  const stemOf = (n) => (n || "output").replace(/\.[^.]*$/, "") || "output";
  const fmtSize = (b) => b >= 1e9 ? (b / 1e9).toFixed(2) + " GB" : b >= 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
  const uniq = (used, name) => {
    if (!used.has(name)) { used.add(name); return name; }
    const dot = name.lastIndexOf("."), base = name.slice(0, dot), ext = name.slice(dot);
    for (let i = 2; ; i++) { const n = `${base}_${i}${ext}`; if (!used.has(n)) { used.add(n); return n; } }
  };
  const el = (tag, props = {}, ...kids) => {
    const e = Object.assign(document.createElement(tag), props);
    kids.forEach((k) => e.append(k));
    return e;
  };
  const pickFiles = (accept, multiple, cb) => {
    const inp = el("input", { type: "file", accept, multiple });
    inp.onchange = () => { if (inp.files && inp.files.length) cb([...inp.files]); };
    inp.click();
  };

  /* ---------- ① 画像 ---------- */
  let thumbUrl = null;
  function setImage(file) {
    if (!file) return;
    if (!(file.type.startsWith("image/") || /^(png|jpe?g|webp|bmp|gif)$/.test(extOf(file.name)))) {
      showError("画像ファイルを選んでください（png / jpg / webp など）。"); return;
    }
    clearError();
    state.image = file;
    if (thumbUrl) URL.revokeObjectURL(thumbUrl);
    thumbUrl = URL.createObjectURL(file);
    $("#thumb").replaceChildren(el("img", { src: thumbUrl, alt: "" }));
    const n = $("#imageName"); n.textContent = file.name; n.classList.remove("empty");
    $("#imageMeta").textContent = fmtSize(file.size);
  }
  $("#pickImage").onclick = () => pickFiles(IMAGE_ACCEPT, false, (f) => setImage(f[0]));

  /* ---------- ② 音声元の行 ---------- */
  function renderRows() {
    const list = $("#list");
    list.replaceChildren(...state.rows.map((r, i) => {
      const name = el("div", { className: "fname" + (r.file ? "" : " empty"), textContent: r.file ? r.file.name : "ファイルを選択、またはここにドロップ" });
      const info = el("div", {}, name, el("div", { className: "meta", textContent: r.file ? fmtSize(r.file.size) : "" }));
      const pick = el("button", { className: "btn", type: "button", textContent: "選択…", disabled: state.busy });
      pick.onclick = () => pickFiles(AUDIO_ACCEPT, true, (fs) => fillRows(r.id, fs));
      const del = el("button", { className: "btn icon", type: "button", textContent: "✕", title: "この行を削除", disabled: state.busy });
      del.setAttribute("aria-label", `音声 ${i + 1} を削除`);
      del.onclick = () => {
        if (state.rows.length === 1) r.file = null; else state.rows = state.rows.filter((x) => x.id !== r.id);
        renderRows();
      };
      return el("div", { className: "row" }, el("span", { className: "tag", textContent: `音声 ${i + 1}` }), info, pick, del);
    }));
  }
  function fillRows(startId, files) {
    clearError();
    let idx = state.rows.findIndex((r) => r.id === startId);
    files.forEach((f, k) => {
      if (k === 0 && idx >= 0) { state.rows[idx].file = f; return; }
      const empty = state.rows.find((r) => !r.file);
      if (empty) empty.file = f; else state.rows.push({ id: state.nextId++, file: f });
    });
    renderRows();
  }
  $("#addRow").onclick = () => { state.rows.push({ id: state.nextId++, file: null }); renderRows(); };

  /* ---------- ドラッグ&ドロップ ---------- */
  const droppable = (node, onFiles) => {
    ["dragenter", "dragover"].forEach((t) => node.addEventListener(t, (e) => { e.preventDefault(); node.classList.add("over"); }));
    ["dragleave", "drop"].forEach((t) => node.addEventListener(t, (e) => { e.preventDefault(); node.classList.remove("over"); }));
    node.addEventListener("drop", (e) => { if (!state.busy && e.dataTransfer && e.dataTransfer.files.length) onFiles([...e.dataTransfer.files]); });
  };
  droppable($("#imageDrop"), (fs) => setImage(fs[0]));
  droppable($("#list"), (fs) => fillRows(-1, fs));
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());

  /* ---------- 表示まわり ---------- */
  function showError(msg) { const e = $("#error"); e.textContent = msg; e.hidden = false; }
  function clearError() { $("#error").hidden = true; }
  function setStatus(msg, frac) {
    $("#progress").hidden = false;
    const pct = Math.round(Math.min(Math.max(frac, 0), 1) * 100);
    $("#statusText").textContent = msg;
    $("#statusPct").textContent = pct + "%";
    $("#barFill").style.width = pct + "%";
    $("#barBox").setAttribute("aria-valuenow", String(pct));
  }
  function setBusy(b) {
    state.busy = b;
    $("#run").disabled = b;
    $("#run").textContent = b ? "作成中…" : "MP4を作る";
    $("#addRow").disabled = b; $("#pickImage").disabled = b;
    document.querySelectorAll('input[name="mode"], #keepMp3').forEach((i) => (i.disabled = b));
    renderRows();
  }
  function setEngine(s, text, retry) {
    const c = $("#engine"); c.dataset.s = s;
    const t = $("#engineText"); t.textContent = text;
    c.querySelector("button")?.remove();
    if (retry) { const b = el("button", { type: "button", textContent: "再試行" }); b.onclick = () => startEngine(); c.append(b); }
  }

  /* ---------- 保存 ---------- */
  async function saveBlob(name, blob) {
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (_) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); } catch (e) { if (!e || e.code !== "declined") showError("保存できませんでした: " + ((e && e.message) || e)); }
      return;
    }
    const a = el("a", { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  function renderResults() {
    const box = $("#results");
    box.hidden = state.results.length === 0;
    const rows = state.results.map((r) => {
      const b = el("button", { className: "btn", type: "button", textContent: "保存" });
      b.onclick = () => saveBlob(r.name, r.blob);
      return el("div", { className: "res" },
        el("span", { className: "kind", textContent: r.kind }),
        el("div", { className: "fname", textContent: r.name }),
        el("span", { className: "size", textContent: fmtSize(r.blob.size) }), b);
    });
    if (state.results.length > 1) {
      const all = el("button", { className: "btn", type: "button", textContent: "すべて保存", style: "align-self:flex-start" });
      all.onclick = async () => { for (const r of state.results) await saveBlob(r.name, r.blob); };
      rows.push(all);
    }
    box.replaceChildren(...rows);
  }

  /* ---------- ffmpeg エンジン ---------- */
  const U = (b, f) => b + f;
  const CDN = (host) => ({
    ffmpegJs: `${host}/@ffmpeg/ffmpeg@${FF_VER}/dist/umd/ffmpeg.js`,
    worker: `${host}/@ffmpeg/ffmpeg@${FF_VER}/dist/umd/814.ffmpeg.js`,
    core: `${host}/@ffmpeg/core@${CORE_VER}/dist/umd/ffmpeg-core.js`,
    wasm: [`${host}/@ffmpeg/core@${CORE_VER}/dist/umd/ffmpeg-core.wasm`],
  });
  const SOURCES = [
    { ffmpegJs: "./ffmpeg.js", worker: "./814.ffmpeg.js", core: "./ffmpeg-core.js",
      wasm: Array.from({ length: WASM_PARTS }, (_, i) => `./ffmpeg-core.part${i}.wasm`) },
    CDN("https://cdn.jsdelivr.net/npm"),
    CDN("https://unpkg.com"),
  ];
  const loadScript = (src) => new Promise((res, rej) => {
    const s = el("script", { src });
    s.onload = res; s.onerror = () => rej(new Error("script " + src));
    document.head.append(s);
  });
  const getBlob = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(r.status + " " + u); return r.blob(); };
  const blobUrl = (parts, type) => URL.createObjectURL(new Blob(parts, { type }));

  let ff = null, enginePromise = null, assets = null;
  let logTail = [], curDur = 0, durHint = 0, progressCb = null;

  const parseDur = (s) => { const m = /Duration:\s*(\d+):(\d+):(\d+(?:\.\d+)?)/.exec(s); return m ? +m[1] * 3600 + +m[2] * 60 + +m[3] : 0; };
  function onLog({ message }) {
    logTail.push(message); if (logTail.length > 14) logTail.shift();
    const d = parseDur(message); if (d > curDur) curDur = d;
  }
  function onProgress({ progress, time }) {
    if (!progressCb) return;
    const d = durHint || curDur;
    const f = d > 0 && time > 0 ? time / 1e6 / d : progress;
    if (isFinite(f)) progressCb(Math.min(Math.max(f, 0), 1));
  }

  async function initEngine() {
    setEngine("loading", "エンジン準備中（初回のみ約30MB）");
    let lastErr = null;
    for (const src of SOURCES) {
      try {
        if (!window.FFmpegWASM) await loadScript(src.ffmpegJs);
        if (!assets || assets.from !== src) {
          const [worker, core, ...wasm] = await Promise.all([getBlob(src.worker), getBlob(src.core), ...src.wasm.map(getBlob)]);
          assets = {
            from: src,
            classWorkerURL: blobUrl([worker], "text/javascript"),
            coreURL: blobUrl([core], "text/javascript"),
            wasmURL: blobUrl(wasm, "application/wasm"),
          };
        }
        const inst = new window.FFmpegWASM.FFmpeg();
        inst.on("log", onLog); inst.on("progress", onProgress);
        // ffmpeg.js は自分の置き場所からワーカーを探すため、読み込み中だけ blob 版へ差し替える
        const RealWorker = window.Worker;
        window.Worker = function (url, opts) { return new RealWorker(/814\.ffmpeg\.js/.test(String(url)) ? assets.classWorkerURL : url, opts); };
        try { await inst.load({ coreURL: assets.coreURL, wasmURL: assets.wasmURL }); } finally { window.Worker = RealWorker; }
        ff = inst;
        setEngine("ready", "準備完了");
        return inst;
      } catch (e) { lastErr = e; assets = null; console.warn("engine source failed", src.core, e); }
    }
    setEngine("failed", "エンジンを読み込めませんでした", true);
    throw lastErr || new Error("engine");
  }
  function startEngine() { enginePromise = initEngine(); enginePromise.catch(() => {}); return enginePromise; }
  const getEngine = () => enginePromise || startEngine();
  async function resetEngine() {
    try { if (ff) ff.terminate(); } catch (_) {}
    ff = null; enginePromise = null;
    startEngine();
  }

  async function exec(inst, args, onFrac, knownDur) {
    logTail = []; curDur = 0; durHint = knownDur || 0; progressCb = onFrac || null;
    let code;
    try { code = await inst.exec(args); } finally { progressCb = null; }
    if (code !== 0) throw new Error(logTail.slice(-6).join("\n") || "ffmpeg exit " + code);
    if (onFrac) onFrac(1);
    return curDur;
  }

  /* ---------- 実行 ---------- */
  async function run() {
    if (state.busy) return;
    const sources = state.rows.map((r) => r.file).filter(Boolean);
    if (!state.image) { showError("① 背景にする画像を選んでください。"); return; }
    if (!sources.length) { showError("② 音声を取り出すファイルを選んでください。"); return; }
    clearError(); state.results = []; renderResults(); setBusy(true);
    const concat = document.querySelector('input[name="mode"]:checked').value === "concat";
    const keepMp3 = $("#keepMp3").checked;
    const n = sources.length, units = n + (concat ? 1 : n);
    let done = 0;
    const report = (msg) => (frac) => setStatus(msg, (done + frac) / units);
    const used = new Set(), results = [];
    const out = (name) => uniq(used, name);
    const cleanup = [];
    try {
      setStatus("エンジンを準備中…", 0);
      const inst = await getEngine();

      const imgName = "img." + (extOf(state.image.name).replace(/[^a-z0-9]/g, "") || "png");
      await inst.writeFile(imgName, new Uint8Array(await state.image.arrayBuffer()));
      cleanup.push(imgName);

      const mp3s = [];
      for (let i = 0; i < n; i++) {
        const f = sources[i];
        const ext = extOf(f.name).replace(/[^a-z0-9]/g, "") || "mp4";
        const dir = "/in" + i, inName = `s${i}.${ext}`, mp3 = `a${i}.mp3`;
        await inst.createDir(dir);
        await inst.mount("WORKERFS", { files: [new File([f], inName)] }, dir);
        let dur = 0;
        try {
          dur = await exec(inst, ["-i", `${dir}/${inName}`, "-vn", "-map", "0:a:0", "-c:a", "libmp3lame", "-b:a", "192k", "-ar", "44100", "-ac", "2", mp3],
            report(`音声を取り出し中 (${i + 1}/${n}): ${f.name}`));
        } catch (e) {
          if (/matches no streams/.test(e.message)) throw new Error(`音声トラックが見つかりません: ${f.name}`);
          throw e;
        } finally {
          try { await inst.unmount(dir); } catch (_) {}
          try { await inst.deleteDir(dir); } catch (_) {}
        }
        done++; cleanup.push(mp3);
        mp3s.push({ stem: stemOf(f.name), file: mp3, dur });
      }

      const makeMp4 = async (stem, mp3File, dur, label) => {
        const outFile = "out.mp4";
        await exec(inst, ["-loop", "1", "-framerate", "5", "-i", imgName, "-i", mp3File,
          "-vf", "scale=w='min(1920,trunc(iw/2)*2)':h=-2,format=yuv420p",
          "-c:v", "libx264", "-preset", "ultrafast", "-tune", "stillimage", "-crf", "23",
          "-c:a", "aac", "-b:a", "192k", "-shortest", "-movflags", "+faststart", outFile], report(label), dur);
        const data = await inst.readFile(outFile);
        await inst.deleteFile(outFile);
        results.push({ kind: "MP4", name: out(stem + ".mp4"), blob: new Blob([data], { type: "video/mp4" }) });
        done++;
      };
      const readMp3 = async (stem, file) => {
        const data = await inst.readFile(file);
        results.push({ kind: "MP3", name: out(stem + ".mp3"), blob: new Blob([data], { type: "audio/mpeg" }) });
      };

      if (concat) {
        let file = mp3s[0].file;
        const stem = mp3s[0].stem + (n > 1 ? "_連結" : "");
        if (n > 1) {
          await inst.writeFile("list.txt", mp3s.map((m) => `file '${m.file}'`).join("\n") + "\n");
          await exec(inst, ["-f", "concat", "-safe", "0", "-i", "list.txt", "-c", "copy", "joined.mp3"]);
          cleanup.push("list.txt", "joined.mp3"); file = "joined.mp3";
        }
        if (keepMp3) await readMp3(stem, file);
        await makeMp4(stem, file, mp3s.reduce((s, m) => s + m.dur, 0), "MP4を作成中");
      } else {
        for (let i = 0; i < n; i++) {
          const m = mp3s[i];
          if (keepMp3) await readMp3(m.stem, m.file);
          await makeMp4(m.stem, m.file, m.dur, `MP4を作成中 (${i + 1}/${n})`);
        }
      }
      state.results = results; renderResults();
      setStatus(`完了: ${results.filter((r) => r.kind === "MP4").length}本のMP4を作りました`, 1);
      const inst2 = inst; for (const f of cleanup) { try { await inst2.deleteFile(f); } catch (_) {} }
    } catch (e) {
      const msg = String((e && e.message) || e);
      $("#progress").hidden = true;
      showError(/memory|abort|OOM|out of bounds/i.test(msg)
        ? "メモリが足りず処理が止まりました。ほかのタブを閉じるか、ファイルを減らして、もう一度お試しください。"
        : /エンジン|engine/.test(msg) ? "エンジンを読み込めませんでした。通信状況を確認して、ページを開き直してください。"
        : msg.startsWith("音声トラック") ? msg : "処理に失敗しました。\n" + msg);
      await resetEngine();
    } finally {
      setBusy(false);
    }
  }
  $("#run").onclick = run;

  renderRows();
  startEngine();
  // テスト用フック（画面には出ません）
  window.__mp4maker = { state };
})();
</script>

</body></html>
