<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>お買い物メモ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;color:#17181a;background:#f6f7f9}
*{box-sizing:border-box} body{margin:0;padding:18px 14px 40px} main{max-width:620px;margin:auto}
.total{background:#fff;border:1px solid #dddfe3;border-radius:18px;padding:18px;margin-bottom:14px}
.total small{color:#6b7078}.total strong{display:block;font-size:34px;margin-top:3px}
.head,.row{display:grid;grid-template-columns:46px minmax(0,1fr) 100px 44px;gap:7px;align-items:center}
.head{font-size:13px;color:#70757d;padding:0 3px 7px;border-bottom:1px solid #d9dce1}
.row{padding:8px 3px;border-bottom:1px solid #e1e3e6}
input[type=checkbox]{width:25px;height:25px}
input[type=text],input[type=number]{width:100%;font-size:16px;padding:11px 9px;border:1px solid #ccd0d5;border-radius:10px;background:#fff}
input[type=number]{text-align:right}.del{border:0;background:transparent;font-size:25px;color:#777;min-height:44px}
.add{width:100%;margin-top:15px;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:700;background:#222;color:#fff}
.note{font-size:12px;color:#777;margin-top:10px;text-align:center}
@media(max-width:360px){body{padding-left:8px;padding-right:8px}.head,.row{grid-template-columns:40px minmax(0,1fr) 88px 40px;gap:5px}}
</style>
</head>
<body><main>
<section class="total"><small>チェックした商品の合計</small><strong id="total">¥0</strong></section>
<div class="head"><span style="text-align:center">✓</span><span>商品名</span><span style="text-align:right">値段</span><span></span></div>
<div id="rows"></div>
<button class="add" id="add" type="button">＋ 商品を追加</button>
<div class="note">入力内容はこの端末のブラウザ内に自動保存されます。</div>
</main>
<script>
const rows=document.getElementById('rows'), total=document.getElementById('total');
let data=[];
try{data=JSON.parse(localStorage.getItem('shoppingMemo')||'[]')}catch(e){}
if(!Array.isArray(data)||!data.length)data=Array.from({length:5},()=>({name:'',price:'',checked:false}));
function save(){localStorage.setItem('shoppingMemo',JSON.stringify(data))}
function calc(){const s=data.reduce((a,x)=>a+(x.checked?Math.max(0,Number(x.price)||0):0),0);total.textContent='¥'+s.toLocaleString('ja-JP')}
function render(){
 rows.innerHTML='';
 data.forEach((x,i)=>{
  const r=document.createElement('div');r.className='row';
  const c=document.createElement('input');c.type='checkbox';c.checked=!!x.checked;c.setAttribute('aria-label','合計に含める');
  const n=document.createElement('input');n.type='text';n.placeholder='商品名';n.value=x.name||'';n.setAttribute('aria-label','商品名');
  const p=document.createElement('input');p.type='number';p.inputMode='numeric';p.min='0';p.step='1';p.placeholder='0';p.value=x.price??'';p.setAttribute('aria-label','値段');
  const d=document.createElement('button');d.type='button';d.className='del';d.textContent='×';d.setAttribute('aria-label','削除');
  c.onchange=()=>{data[i].checked=c.checked;save();calc()};
  n.oninput=()=>{data[i].name=n.value;save()};
  p.oninput=()=>{data[i].price=p.value;save();calc()};
  d.onclick=()=>{data.splice(i,1);save();render()};
  r.append(c,n,p,d);rows.appendChild(r);
 });calc()
}
document.getElementById('add').onclick=()=>{if(data.length>=100)return;data.push({name:'',price:'',checked:false});save();render();rows.lastElementChild?.querySelector('input[type=text]')?.focus()};
render();
</script></body></html>
